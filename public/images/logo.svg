<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Film reel circle -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="url(#grad)" stroke-width="2.5"/>
  <!-- Film sprocket holes -->
  <circle cx="24" cy="6" r="2.5" fill="url(#grad)"/>
  <circle cx="24" cy="42" r="2.5" fill="url(#grad)"/>
  <circle cx="6" cy="24" r="2.5" fill="url(#grad)"/>
  <circle cx="42" cy="24" r="2.5" fill="url(#grad)"/>
  <!-- Play triangle -->
  <polygon points="19,14 19,34 36,24" fill="url(#grad)"/>
</svg>
