services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: film-app-prod
    restart: unless-stopped
    ports:
      # Format: [Port Eksternal Anda di CasaOS]:[Port Internal]
      # Diubah menjadi 8383 karena 8080 sering sibuk. Bebas Anda modifikasi.
      - "8383:80"
    volumes:
      # Data penyimpanan persisten (Poster, Upload Banner, dll)
      - ./storage-data:/app/storage/app/public
      # Log file 
      - ./logs:/app/storage/logs
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      # Sesuaikan nilai variabel ini di file .env Anda atau settings CasaOS
      - DB_DATABASE=${DB_DATABASE:-film_db}
      - DB_USERNAME=${DB_USERNAME:-film_user}
      - DB_PASSWORD=${DB_PASSWORD:-SecretStrongPassword123!}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - film-network

  postgres:
    image: postgres:16-alpine
    container_name: film-postgres-prod
    restart: unless-stopped
    # PORT 5432 TIDAK DIEKSPOS ke luar container untuk keamanan
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-film_db}
      POSTGRES_USER: ${DB_USERNAME:-film_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecretStrongPassword123!}
    volumes:
      # Folder persisten database, bagus untuk CasaOS / DATA tab
      - ./db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-film_user} -d ${DB_DATABASE:-film_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - film-network

  redis:
    image: redis:7-alpine
    container_name: film-redis-prod
    restart: unless-stopped
    # PORT 6379 TIDAK DIEKSPOS ke luar container untuk keamanan
    expose:
      - "6379"
    volumes:
      - ./redis-data:/data
    networks:
      - film-network

networks:
  film-network:
    driver: bridge
